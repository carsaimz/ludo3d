name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci
      - run: npm test
      - run: npm run build
      - name: Compactar build web
        run: cd dist && zip -r ../ludo3d-web.zip . && cd ..
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: ludo3d-web.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci
      - run: npm run build
      - name: Preparar projeto Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      - name: Build APK (debug, instalável)
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Build APK (release, sem assinar)
        run: cd android && ./gradlew assembleRelease || true
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk

  desktop:
    strategy:
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci
        shell: bash
      - run: npm run build
        shell: bash
      - name: Empacotar desktop
        run: npx electron-builder ${{ matrix.args }} --publish never
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.tar.gz
          if-no-files-found: ignore

  publish:
    needs: [web, android, desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Criar release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/web/*
            artifacts/android/*
            artifacts/desktop-*/*
